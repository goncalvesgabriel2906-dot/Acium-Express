<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACIUM - Tietê Plaza Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --fundo: #0a1120; 
            --cartao: #111a2e; 
            --texto: #f8fafc; 
            --cinza: #94a3b8; 
            --azul: #38bdf8; 
            --verde: #22c55e; 
            --rosa: #f472b6;
            --tiete-gold: #fbbf24; /* Cor temática para o Tietê Plaza */
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: var(--fundo); 
            color: var(--texto); 
            font-family: 'Segoe UI', sans-serif; 
            padding: 20px; 
            display: flex; justify-content: center;
        }
        
        #login-screen {
            background: var(--cartao); padding: 40px; border-radius: 15px;
            width: 100%; max-width: 380px; text-align: center; border: 1px solid #1e293b;
            margin-top: 50px;
        }
        #login-screen input { 
            width: 100%; padding: 12px; margin-bottom: 10px; 
            border-radius: 8px; border: 1px solid #1e293b; background: #0d1629; color: white;
        }
        #login-screen button { 
            width: 100%; background: var(--tiete-gold); padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; color: #000;
        }

        #painel-conteudo { display: none; width: 100%; max-width: 1100px; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .form-cadastro {
            background: var(--cartao); padding: 20px; border-radius: 15px; 
            border: 1px solid var(--tiete-gold); margin-bottom: 30px;
        }

        .grid-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; }
        .grid-inputs div { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 11px; color: var(--tiete-gold); font-weight: bold; text-transform: uppercase; }
        input { background: #0d1629; border: 1px solid #1e293b; color: white; padding: 8px; border-radius: 6px; }

        .menu-meses { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .btn-container { display: flex; align-items: center; background: var(--cartao); border: 1px solid #1e293b; border-radius: 8px; overflow: hidden; }
        
        .btn-mes { 
            background: none; border: none; color: var(--cinza); 
            padding: 10px 15px; cursor: pointer; font-weight: bold;
        }
        .btn-container.ativo { border-color: var(--tiete-gold); background: rgba(251, 191, 36, 0.1); }
        .btn-container.ativo .btn-mes { color: var(--tiete-gold); }
        
        .btn-excluir {
            background: rgba(244, 114, 182, 0.1); border: none; color: var(--rosa);
            padding: 10px; cursor: pointer; font-size: 12px; transition: 0.3s;
            border-left: 1px solid #1e293b;
        }
        .btn-excluir:hover { background: var(--rosa); color: white; }

        .grid-resumo { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: var(--cartao); padding: 20px; border-radius: 15px; border: 1px solid #1e293b; }
        .valor-card { font-size: 1.8rem; font-weight: bold; margin-top: 5px; display: block; }
        .canvas-container { height: 300px; margin-top: 20px; }
        
        .btn-salvar { 
            grid-column: 1 / -1; background: var(--verde); color: white; border: none; 
            padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px;
        }
    </style>
</head>
<body>

<div id="login-screen">
    <h2 style="color: var(--tiete-gold); margin-bottom: 20px;">ACIUM TIETÊ LOGIN</h2>
    <input type="password" id="pass-input" placeholder="Senha do Sistema">
    <button onclick="verificarAcesso()">Entrar</button>
</div>

<div id="painel-conteudo">
    <header style="margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center;">
        <h1>ACIUM-TIETÊ <small id="displayMes" style="color: var(--cinza); font-size: 16px;">| DASHBOARD PLAZA</small></h1>
        <button onclick="location.reload()" style="background:none; border:none; color:var(--rosa); cursor:pointer; font-weight:bold;">SAIR</button>
    </header>

    <div class="form-cadastro">
        <h3 style="margin-bottom: 15px; font-size: 14px; color: var(--cinza);">LANÇAMENTO MENSAL - TIETÊ PLAZA</h3>
        <div class="grid-inputs">
            <div><label>Mês de Referência</label><input type="text" id="in-nome" placeholder="Ex: Abril 2026"></div>
            <div><label>Total Pedidos</label><input type="number" id="in-pedidos" placeholder="0"></div>
            <div><label>Semana 1 (R$)</label><input type="number" id="s1" class="sem" value="0"></div>
            <div><label>Semana 2 (R$)</label><input type="number" id="s2" class="sem" value="0"></div>
            <div><label>Semana 3 (R$)</label><input type="number" id="s3" class="sem" value="0"></div>
            <div><label>Semana 4 (R$)</label><input type="number" id="s4" class="sem" value="0"></div>
            <button class="btn-salvar" onclick="salvarDados()">REGISTRAR VENDAS</button>
        </div>
    </div>

    <div class="menu-meses" id="container-filtros"></div>

    <div id="dashboard-visual" style="display: none;">
        <div class="grid-resumo">
            <div class="card"><p style="color:var(--cinza); font-size: 12px;">FATURAMENTO TOTAL</p><span class="valor-card" id="vendaTotal" style="color: var(--tiete-gold);">R$ 0,00</span></div>
            <div class="card"><p style="color:var(--cinza); font-size: 12px;">TOTAL PEDIDOS</p><span class="valor-card" id="pedidoTotal">0</span></div>
            <div class="card"><p style="color:var(--cinza); font-size: 12px;">TICKET MÉDIO</p><span class="valor-card" id="ticketMedio" style="color: var(--verde);">R$ 0,00</span></div>
        </div>

        <div class="card">
            <h3 style="font-size: 14px; color: var(--cinza);">ANÁLISE DE RENDIMENTO SEMANAL</h3>
            <div class="canvas-container"><canvas id="graficoPrincipal"></canvas></div>
        </div>
    </div>
</div>

<script>
    const BANCO_DE_DADOS = {};
    let meuGrafico = null;
    let mesSelecionadoAtualmente = null;

    function verificarAcesso() {
        // Mantive a senha padrão que você usava
        if(document.getElementById('pass-input').value === "acium") {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('painel-conteudo').style.display = 'block';
        } else { alert("Senha incorreta"); }
    }

    function salvarDados() {
        const nome = document.getElementById('in-nome').value;
        const ped = parseInt(document.getElementById('in-pedidos').value) || 0;
        const v1 = parseFloat(document.getElementById('s1').value) || 0;
        const v2 = parseFloat(document.getElementById('s2').value) || 0;
        const v3 = parseFloat(document.getElementById('s3').value) || 0;
        const v4 = parseFloat(document.getElementById('s4').value) || 0;

        if(!nome) return alert("Digite o nome do mês!");

        const totalFaturamento = v1 + v2 + v3 + v4;
        const id = nome.toLowerCase().replace(/\s+/g, '-');

        BANCO_DE_DADOS[id] = {
            nome: nome,
            faturamento: totalFaturamento,
            pedidos: ped,
            semanas: [v1, v2, v3, v4]
        };

        document.getElementById('dashboard-visual').style.display = 'block';
        gerarMenu();
        atualizarPainel(id);
        
        document.getElementById('in-nome').value = "";
        document.querySelectorAll('.sem').forEach(i => i.value = 0);
        document.getElementById('in-pedidos').value = "";
    }

    function gerarMenu() {
        const container = document.getElementById('container-filtros');
        container.innerHTML = '';
        const keys = Object.keys(BANCO_DE_DADOS);
        
        if(keys.length === 0) {
            document.getElementById('dashboard-visual').style.display = 'none';
            document.getElementById('displayMes').innerText = "| AGUARDANDO DADOS";
            return;
        }

        keys.forEach(key => {
            const wrapper = document.createElement('div');
            wrapper.className = 'btn-container' + (key === mesSelecionadoAtualmente ? ' ativo' : '');
            
            const btn = document.createElement('button');
            btn.className = 'btn-mes';
            btn.innerText = BANCO_DE_DADOS[key].nome;
            btn.onclick = () => atualizarPainel(key);
            
            const btnExcluir = document.createElement('button');
            btnExcluir.className = 'btn-excluir';
            btnExcluir.innerHTML = '✕';
            btnExcluir.onclick = (e) => {
                e.stopPropagation();
                excluirMes(key);
            };

            wrapper.appendChild(btn);
            wrapper.appendChild(btnExcluir);
            container.appendChild(wrapper);
        });
    }

    function excluirMes(key) {
        if(confirm("Deseja remover os dados de " + BANCO_DE_DADOS[key].nome + "?")) {
            delete BANCO_DE_DADOS[key];
            if(mesSelecionadoAtualmente === key) {
                mesSelecionadoAtualmente = Object.keys(BANCO_DE_DADOS)[0] || null;
            }
            gerarMenu();
            if(mesSelecionadoAtualmente) atualizarPainel(mesSelecionadoAtualmente);
        }
    }

    function atualizarPainel(key) {
        mesSelecionadoAtualmente = key;
        const dados = BANCO_DE_DADOS[key];
        
        gerarMenu();

        document.getElementById('displayMes').innerText = "| " + dados.nome.toUpperCase();
        document.getElementById('vendaTotal').innerText = dados.faturamento.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
        document.getElementById('pedidoTotal').innerText = dados.pedidos;
        
        const ticket = dados.pedidos > 0 ? (dados.faturamento / dados.pedidos) : 0;
        document.getElementById('ticketMedio').innerText = ticket.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});

        const ctx = document.getElementById('graficoPrincipal').getContext('2d');
        if(meuGrafico) meuGrafico.destroy();
        
        meuGrafico = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Semana 1', 'Semana 2', 'Semana 3', 'Semana 4'],
                datasets: [{
                    label: 'Vendas Tietê (R$)',
                    data: dados.semanas,
                    backgroundColor: '#fbbf24', // Cor Tietê Plaza
                    borderRadius: 5
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { grid: { color: '#1e293b' }, ticks: { color: '#94a3b8' } },
                    x: { ticks: { color: '#94a3b8' } }
                },
                plugins: { legend: { display: false } }
            }
        });
    }
</script>

</body>
</html>
